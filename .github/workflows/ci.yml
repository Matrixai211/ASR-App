name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asr
          POSTGRES_PASSWORD: asr
          POSTGRES_DB: asr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asr -d asr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Sync schema for CI
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://asr:asr@localhost:5432/asr
      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://asr:asr@localhost:5432/asr
